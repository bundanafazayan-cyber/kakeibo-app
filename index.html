<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kakeibo — Pencatatan Keuangan Keluarga</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#FAF9F5" id="metaThemeColor">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kakeibo">

  <!-- Anti-FOUC Script (Deteksi Tema Gelap/Terang Instan Sebelum Render) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('kakeibo_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- Google Fonts: Newsreader (Editorial Serif) + Plus Jakarta Sans (Data Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind CSS CDN & Zen Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Newsreader', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            zen: {
              paper: '#FAF9F5',       // Background mode terang
              surface: '#FFFFFF',     // Card mode terang
              subtle: '#F2EFEB',      // Border & input mode terang
              charcoal: '#141413',    // Background mode gelap
              cardDark: '#1C1B1A',    // Card mode gelap
              subtleDark: '#282725',  // Border & input mode gelap
              ink: '#1A1918',         // Teks utama terang
              inkMuted: '#73716B',    // Teks sekunder terang
              cream: '#ECE9E2',       // Teks utama gelap
              creamMuted: '#9E9B93',  // Teks sekunder gelap
              accent: '#264E36',      // Hijau pinus jepang
              accentHover: '#1B3B28',
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js & SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Scrollbar Halus */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D6D3CD; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #383734; }

    /* .k-card diselaraskan dengan fungsi render di app.js */
    .k-card {
      background-color: #FFFFFF;
      border: 1px solid #EAE7E1;
      border-radius: 1rem;
      transition: all 0.2s ease-in-out;
    }
    .dark .k-card {
      background-color: #1C1B1A;
      border-color: #2D2C2A;
    }

    /* 4 Pilar Kategori - Muted Tone */
    .badge-needs { background-color: #EBF8FF; color: #2B4365; border: 1px solid #BEE3F8; }
    .dark .badge-needs { background-color: #1A2942; color: #90CDF4; border-color: #2B4365; }
    .card-border-needs { border-left: 4px solid #3182CE; }

    .badge-wants { background-color: #FAF5FF; color: #6B46C1; border: 1px solid #E9D8FD; }
    .dark .badge-wants { background-color: #2D1F47; color: #D6BCFA; border-color: #44337A; }
    .card-border-wants { border-left: 4px solid #805AD5; }

    .badge-culture { background-color: #FFFAF0; color: #975A16; border: 1px solid #FEEBC8; }
    .dark .badge-culture { background-color: #3D2A12; color: #FBD38D; border-color: #744210; }
    .card-border-culture { border-left: 4px solid #D69E2E; }

    .badge-unexpected { background-color: #FFF5F5; color: #9B2C2C; border: 1px solid #FED7D7; }
    .dark .badge-unexpected { background-color: #3F1717; color: #FEB2B2; border-color: #742A2A; }
    .card-border-unexpected { border-left: 4px solid #E53E3E; }

    .badge-pemasukan { background-color: #F0FFF4; color: #22543D; border: 1px solid #C6F6D5; }
    .dark .badge-pemasukan { background-color: #143024; color: #9AE6B4; border-color: #22543D; }
    .card-border-pemasukan { border-left: 4px solid #38A169; }

    @keyframes danger-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .animate-overbudget { animation: danger-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    /* Tab Button Aktif */
    .tab-btn.active {
      background-color: #1A1918;
      color: #FAF9F5;
    }
    .dark .tab-btn.active {
      background-color: #ECE9E2;
      color: #141413;
    }

    /* Mobile Bottom Nav Button Aktif */
    .mobile-nav-btn.active {
      color: #1A1918;
      font-weight: 700;
    }
    .dark .mobile-nav-btn.active {
      color: #ECE9E2;
    }

    /* Splash Screen Zen */
    #splashScreen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background-color: #FAF9F5;
      transition: opacity 0.35s ease-out;
    }
    .dark #splashScreen {
      background-color: #141413;
    }
    #splashScreen.fade-out { opacity: 0; pointer-events: none; }
  </style>
</head>
<body class="bg-zen-paper dark:bg-zen-charcoal text-zen-ink dark:text-zen-cream min-h-screen pb-24 md:pb-12 transition-colors duration-200">

  <!-- SPLASH SCREEN -->
  <div id="splashScreen">
    <div class="w-16 h-16 rounded-2xl bg-stone-900 dark:bg-stone-100 flex items-center justify-center text-white dark:text-stone-900 font-serif text-3xl font-bold shadow-md">
      家
    </div>
    <p class="font-display text-2xl font-medium tracking-tight text-stone-900 dark:text-stone-100 mt-4">Kakeibo</p>
    <p class="text-xs text-stone-500 dark:text-stone-400 mt-1">Pencatatan Keuangan Keluarga (Offline & Privat)</p>
  </div>
